<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络连接</title>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        p {
            margin: 10px 0;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div id="connectionInfo">
        <p><strong>网络类型</strong>：<span id="type">检测中...</span></p>
        <p><strong>连接有效类型</strong>：<span id="effectiveType">检测中...</span></p>
        <p><strong>有效带宽</strong>：<span id="downlink">检测中...</span></p>
        <p><strong>最快下载速度</strong>：<span id="downlinkMax">检测中...</span></p>
        <p><strong>往返时延</strong>：<span id="rtt">检测中...</span></p>
        <p><strong>省流量模式</strong>：<span id="saveData">检测中...</span></p>
    </div>

    <script>
        function updateConnectionInfo() {
            if (!navigator.connection) {
                document.getElementById('connectionInfo').innerHTML = '<p>当前浏览器不支持网络连接 API</p>';
                return;
            }

            const connection = navigator.connection;
            document.getElementById('type').textContent = connection.type || '未知';
            document.getElementById('effectiveType').textContent = connection.effectiveType || '未知';
            document.getElementById('downlink').textContent = (connection.downlink || '未知') + ' Mb/s';
            document.getElementById('downlinkMax').textContent = (connection.downlinkMax || '未知') + ' Mb/s';
            document.getElementById('rtt').textContent = (connection.rtt || '未知') + ' ms';
            document.getElementById('saveData').textContent = connection.saveData ? '是' : '否';
        }

        updateConnectionInfo();

        if (navigator.connection) {
            navigator.connection.addEventListener('change', updateConnectionInfo);
        }
    </script>
</body>
</html>
