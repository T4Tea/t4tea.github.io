<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugins</title>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #4285f4;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background: #f8f9fa;
        }
        td {
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <table id="pluginTable">
        <thead>
            <tr>
                <th>Plugin Name</th>
                <th>File Name</th>
                <th>Description</th>
                <th>Version</th>
                <th>MIME Type</th>
                <th>Description</th>
                <th>Suffixes</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        var L = navigator.plugins.length;
        var tb = document.getElementById('pluginTable');
        for (var i = 0; i < L; i++) {
            let newRow = tb.insertRow();
            newRow.insertCell().textContent = navigator.plugins[i].name;
            newRow.insertCell().textContent = navigator.plugins[i].filename;
            newRow.insertCell().textContent = navigator.plugins[i].description;
            newRow.insertCell().textContent = navigator.plugins[i].version;
            var ml = navigator.plugins[i].length;
            var mt = "";
            var md = "";
            var ms = "";
            for (var j = 0; j < ml; j++) {
                mt += navigator.plugins[i][j].type + " | ";
                md += navigator.plugins[i][j].description + " | ";
                ms += navigator.plugins[i][j].suffixes + " | ";
            }
            newRow.insertCell().textContent = mt.slice(0, -3);
            newRow.insertCell().textContent = md.slice(0, -3);
            newRow.insertCell().textContent = ms.slice(0, -3);
        }
    </script>
</body>
</html>
