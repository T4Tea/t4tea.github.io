<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VJX</title>
	<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			height: 100%;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		}
		.container {
			display: flex;
			gap: 8px;
			padding: 10px;
			background: #f5f5f5;
		}
		select, input {
			padding: 8px;
			border: 1px solid #ddd;
			border-radius: 4px;
			font-size: 14px;
		}
		select {
			flex: 0 0 15%;
		}
		input[type="text"] {
			flex: 1;
		}
		input[type="button"] {
			flex: 0 0 10%;
			background: #4285f4;
			color: white;
			cursor: pointer;
			border: none;
		}
		input[type="button"]:hover {
			background: #3367d6;
		}
		iframe {
			width: 100%;
			height: calc(100% - 60px);
			border: none;
			background: #000;
		}
		.note {
			padding: 10px;
			background: #fff3cd;
			border: 1px solid #ffc107;
			border-radius: 4px;
			margin: 10px;
			font-size: 14px;
			color: #856404;
		}
	</style>
</head>
<body>
	<div class="container">
		<select id="jx">
			<option value="">选择解析服务</option>
			<option value="https://jx.xmflv.com/?url=">XMFLV解析</option>
			<option value="https://jx.bozrc.com:4433/player/?url=">不知名解析</option>
			<option value="https://www.yemu.xyz/?url=">夜幕解析</option>
			<option value="https://jx.m3u8.tv/jiexi/?url=">M3U8.TV解析</option>
		</select>
		<input type="text" id="url" placeholder="在此处粘贴视频链接" />
		<input type="button" id="play" value="点击播放" />
	</div>
	<div class="note">
		注意：视频解析服务可能不稳定，如遇问题请尝试其他服务。
	</div>
	<iframe id="player" allowfullscreen></iframe>
	<script>
		document.getElementById('play').addEventListener('click', function() {
			var jx = document.getElementById('jx').value;
			var url = document.getElementById('url').value.trim();

			if (!jx) {
				alert('请选择解析服务');
				return;
			}

			if (!url) {
				alert('请输入视频链接');
				return;
			}

			// 验证 URL 格式
			try {
				new URL(url);
			} catch (e) {
				alert('请输入有效的 URL');
				return;
			}

			document.getElementById('player').src = jx + encodeURIComponent(url);
		});

		// 支持回车键
		document.getElementById('url').addEventListener('keypress', function(e) {
			if (e.key === 'Enter') {
				document.getElementById('play').click();
			}
		});
	</script>
</body>
</html>
