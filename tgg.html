<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background: #f5f0eb;
            color: #6b5847;
        }

        header {
            padding: 26px 32px;
            background: linear-gradient(135deg, #ece3dc 0%, #e0d4c8 100%);
            border-bottom: 1px solid #ddd4ca;
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        ol {
            list-style: none;
            padding: 22px 24px;
            max-width: 920px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        ol > li {
            background: #ffffff;
            border: 1px solid #e8ddd3;
            border-radius: 10px;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 1px 3px rgba(120, 90, 60, 0.05);
        }

        ol > li:hover {
            background: #f2ebe3;
            border-color: #c4a98e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(120, 90, 60, 0.10);
        }

        ol > li a {
            display: block;
            padding: 16px 6px;
            color: #6b5847;
            text-decoration: none;
            font-size: 0.95rem;
        }

        ol > li a:hover {
            color: #9c7350;
        }

        @media (max-width: 480px) {
            header {
                padding: 20px 16px;
            }

            header h1 {
                font-size: 1.2rem;
            }

            ol {
                padding: 16px 12px;
                gap: 8px;
            }

            ol > li a {
                padding: 12px 2px;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
