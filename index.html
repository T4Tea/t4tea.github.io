<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人书签管理首页">
    <title>首页</title>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <div class="toolbar-title">书签管理</div>
        <button class="edit-mode-btn" id="editModeBtn" aria-label="编辑模式">
            <span class="edit-icon">✏️</span>
            <span class="edit-text">编辑</span>
        </button>
    </header>

    <!-- 搜索容器 -->
    <div class="search-container">
        <div class="search-engines" role="radiogroup" aria-label="选择搜索引擎">
            <button class="search-engine-btn active" data-engine="baidu" role="radio" aria-checked="true">
                百度
            </button>
            <button class="search-engine-btn" data-engine="google" role="radio" aria-checked="false">
                Google
            </button>
            <button class="search-engine-btn" data-engine="bing" role="radio" aria-checked="false">
                必应
            </button>
        </div>
        <div class="search-box">
            <input
                type="text"
                class="search-input"
                placeholder="请输入搜索内容..."
                aria-label="搜索内容"
                autofocus
            />
            <button class="search-btn" aria-label="搜索">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="M21 21l-4.35-4.35"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- 书签容器 -->
    <div class="bookmarks-container">
        <div class="bookmarks-grid" role="list" aria-label="书签列表">
            <!-- 书签将通过 JavaScript 动态生成 -->
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加书签</h3>
                <button class="modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="titleInput">标题</label>
                    <input
                        type="text"
                        id="titleInput"
                        placeholder="输入书签标题"
                        autocomplete="off"
                    />
                </div>
                <div class="form-group">
                    <label for="urlInput">网址</label>
                    <input
                        type="url"
                        id="urlInput"
                        placeholder="https://example.com"
                        autocomplete="off"
                    />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary">取消</button>
                <button class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认删除对话框 -->
    <div class="modal confirm-dialog" id="confirmModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div class="modal-body">
                <div class="confirm-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="confirm-title" id="confirmTitle">删除书签</div>
                <div class="confirm-message" id="confirmMessage">确定要删除这个书签吗？</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary">取消</button>
                <button class="btn btn-danger">删除</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <!-- JavaScript -->
    <script src="/js/app.js"></script>
</body>
</html>
