<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="首页">
    <meta name="color-scheme" content="light dark">
    <title>首页</title>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
        // 尽早应用主题，避免闪烁
        (function() {
            const mode = localStorage.getItem('theme');
            if (mode === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (mode === 'light') {
                document.documentElement.classList.add('light');
            }
            // 未设置时跟随系统（由 CSS media query 处理）
        })();
    </script>
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="切换主题">
            <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
        <div class="toolbar-title"></div>
        <div class="toolbar-actions">
            <button class="edit-mode-btn" id="editModeBtn" aria-label="编辑模式">
                <span class="edit-icon">✏️</span>
            </button>
        </div>
    </header>

    <!-- 搜索容器 -->
    <div class="search-container">
        <div class="search-engines" role="radiogroup" aria-label="选择搜索引擎">
            <button class="search-engine-btn active" data-engine="baidu" role="radio" aria-checked="true">
                百度
            </button>
            <button class="search-engine-btn" data-engine="google" role="radio" aria-checked="false">
                Google
            </button>
            <button class="search-engine-btn" data-engine="bing" role="radio" aria-checked="false">
                必应
            </button>
        </div>
        <div class="search-box">
            <input
                type="text"
                class="search-input"
                placeholder="请输入搜索内容..."
                aria-label="搜索内容"
                autofocus
            />
            <button class="search-btn" aria-label="搜索">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="M21 21l-4.35-4.35"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- 书签容器 -->
    <div class="bookmarks-container">
        <div class="bookmarks-grid" role="list" aria-label="书签列表">
            <!-- 书签将通过 JavaScript 动态生成 -->
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加书签</h3>
                <button class="modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="titleInput">标题</label>
                    <input
                        type="text"
                        id="titleInput"
                        placeholder="输入书签标题"
                        autocomplete="off"
                    />
                </div>
                <div class="form-group">
                    <label for="urlInput">网址</label>
                    <input
                        type="url"
                        id="urlInput"
                        placeholder="https://example.com"
                        autocomplete="off"
                    />
                </div>
                <div class="form-group">
                    <label for="iconInput">图标 <span class="label-hint">（留空则使用网站默认图标）</span></label>
                    <div class="icon-input-row">
                        <div class="icon-preview" id="iconPreview">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </div>
                        <input
                            type="url"
                            id="iconInput"
                            placeholder="留空自动获取 favicon"
                            autocomplete="off"
                        />
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary">取消</button>
                <button class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认删除对话框 -->
    <div class="modal confirm-dialog" id="confirmModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div class="modal-body">
                <div class="confirm-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="confirm-title" id="confirmTitle">删除书签</div>
                <div class="confirm-message" id="confirmMessage">确定要删除这个书签吗？</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary">取消</button>
                <button class="btn btn-danger">删除</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <!-- JavaScript -->
    <script src="/js/app.js"></script>
</body>
</html>
